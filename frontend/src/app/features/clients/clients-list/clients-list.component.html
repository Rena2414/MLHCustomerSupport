<h2>Clients</h2>
<div class="card">
  <table class="data-table">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Plan</th><th>Status</th></tr>
    </thead>
    <tbody>
      @for (c of customers$ | async; track c.id) {
        <tr>
          <td><a [routerLink]="['/clients', c.id]">{{ c.fullName }}</a></td>
          <td>{{ c.email }}</td>
          <td>{{ c.plan }}</td>
          <td><span [class]="'badge ' + c.subscriptionStatus.toLowerCase()">{{ c.subscriptionStatus }}</span></td>
        </tr>
      }
    </tbody>
  </table>
</div>
